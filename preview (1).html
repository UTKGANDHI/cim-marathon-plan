<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Utkarsh — CIM 2026 3:55 Marathon Plan</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root{
      --bg:#f5f8fb; --panel:#ffffff; --panel2:#edf3f8; --text:#102033;
      --muted:#5f7287; --line:#d8e1ea; --accent:#147d64; --accent2:#2e6fc2;
      --warn:#9a6500; --danger:#b33d3d; --shadow:0 18px 55px rgba(26,45,65,.12);
      --hero1:rgba(255,255,255,.98); --hero2:rgba(239,246,250,.97);
      --body1:rgba(20,125,100,.10); --body2:rgba(46,111,194,.08);
      --glass:rgba(245,248,251,.88); --card1:rgba(255,255,255,.96); --card2:rgba(245,249,252,.96);
      --soft:rgba(16,32,51,.035); --modal1:#ffffff; --modal2:#eef4f8;
      --radius:20px;
    }
    html[data-theme="dark"]{
      --bg:#07111f; --panel:#0c1a2b; --panel2:#11243a; --text:#edf5ff;
      --muted:#9eb2c9; --line:#203852; --accent:#72e1b8; --accent2:#82b8ff;
      --warn:#ffd479; --danger:#ff9b9b; --shadow:0 18px 55px rgba(0,0,0,.28);
      --hero1:rgba(17,36,58,.95); --hero2:rgba(8,22,36,.93);
      --body1:rgba(114,225,184,.17); --body2:rgba(130,184,255,.14);
      --glass:rgba(7,17,31,.86); --card1:rgba(17,36,58,.84); --card2:rgba(10,25,41,.86);
      --soft:rgba(255,255,255,.035); --modal1:#10243a; --modal2:#091827;
    }
    html[data-theme="light"]{
      color-scheme:light;
    }
    html[data-theme="dark"]{
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif; background:
      radial-gradient(1100px 500px at 10% -10%, var(--body1), transparent 60%),
      radial-gradient(900px 450px at 90% 0%, var(--body2), transparent 60%), var(--bg);
      color:var(--text); line-height:1.55;
    }
    button{font:inherit}
    .app{max-width:1220px;margin:0 auto;padding:28px 20px 80px}
    .hero{
      position:relative;overflow:hidden;padding:34px;border:1px solid var(--line);
      border-radius:28px;background:linear-gradient(145deg,var(--hero1),var(--hero2));
      box-shadow:var(--shadow);
    }
    .hero:after{
      content:""; position:absolute; width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle,rgba(114,225,184,.14),transparent 65%);
      right:-100px;top:-180px;pointer-events:none
    }
    .eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--accent);
      font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.78rem}
    h1{font-size:clamp(2.25rem,6vw,4.4rem);line-height:.98;margin:14px 0 16px;letter-spacing:-.05em}
    h2{font-size:1.65rem;margin:0 0 16px;letter-spacing:-.025em}
    h3{font-size:1.08rem;margin:0 0 9px}
    p{margin:0 0 12px;color:var(--text)}
    .lead{font-size:1.08rem;max-width:800px;color:var(--muted)}
    .badges{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 0}
    .badge{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:var(--soft);
      color:var(--text);font-size:.88rem;font-weight:700}
    .badge.accent{color:#061b14;background:var(--accent);border-color:transparent}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    .btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:12px;
      cursor:pointer;font-weight:750}
    .btn:hover{transform:translateY(-1px);border-color:#355675}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#042218}
    .nav{position:sticky;top:10px;z-index:20;display:flex;gap:7px;overflow:auto;margin:18px 0;
      padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(14px)}
    .nav button{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:750}
    .nav button.active{background:var(--panel2);color:var(--text)}
    .section{padding:24px 0}
    .grid{display:grid;gap:16px}
    .grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,var(--card1),var(--card2));
      padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.12)}
    .metric .value{font-size:1.85rem;font-weight:850;letter-spacing:-.04em}
    .metric .label{color:var(--muted);font-size:.86rem}
    .metric .note{color:var(--muted);font-size:.82rem;margin-top:5px}
    .callout{border-left:4px solid var(--accent);padding:16px 18px;background:rgba(114,225,184,.07);border-radius:12px}
    .callout.warn{border-left-color:var(--warn);background:rgba(255,212,121,.07)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px}
    table{border-collapse:collapse;width:100%;min-width:760px;background:var(--panel)}
    th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    th{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:rgba(255,255,255,.025)}
    td{color:var(--text)}
    tr:last-child td{border-bottom:0}
    .zone-name{font-weight:850;color:var(--text)}
    .pace{font-variant-numeric:tabular-nums;font-weight:750;color:var(--accent)}
    .muted{color:var(--muted)}
    .week-toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:14px}
    .week-list{display:grid;gap:12px}
    .week{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card2)}
    .week-head{width:100%;display:grid;grid-template-columns:80px 1fr auto auto;gap:14px;align-items:center;
      padding:16px 18px;border:0;background:transparent;color:var(--text);cursor:pointer;text-align:left}
    .week-head:hover{background:rgba(255,255,255,.025)}
    .week-num{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--panel2);font-weight:900}
    .week-title{font-weight:850}.week-sub{font-size:.85rem;color:var(--muted);margin-top:2px}
    .mileage{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
    .chev{color:var(--muted);font-size:1.25rem}
    .week-body{padding:0 18px 18px}
    .days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
    .day{border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--soft);min-height:136px}
    .day.long{border-color:rgba(114,225,184,.55);background:rgba(114,225,184,.055)}
    .day .dayname{font-size:.72rem;color:var(--muted);font-weight:850;letter-spacing:.08em;text-transform:uppercase}
    .day .dist{font-weight:900;margin:4px 0 6px}
    .day .details{font-size:.84rem;color:var(--muted)}
    .pill{display:inline-block;padding:3px 7px;border-radius:999px;background:rgba(130,184,255,.10);color:#cfe2ff;font-size:.72rem;font-weight:800;margin-top:8px}
    .pill.long{background:rgba(114,225,184,.12);color:#caffea}
    .chart{width:100%;height:250px}
    .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}

    .calendar-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
    .date-card{
      appearance:none;width:100%;text-align:left;color:var(--text);font:inherit;cursor:pointer;
      border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--soft);
      min-height:145px;transition:.16s ease;
    }
    .date-card:hover{transform:translateY(-2px);border-color:#426887;background:rgba(255,255,255,.045)}
    .date-card.long{border-color:rgba(114,225,184,.55);background:rgba(114,225,184,.055)}
    .date-card.quality{border-color:rgba(130,184,255,.5);background:rgba(130,184,255,.045)}
    .date-card.race{border-color:var(--warn);background:rgba(255,212,121,.075)}
    .date-card.rest{opacity:.82}
    .date-top{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
    .date-label{font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .date-num{font-size:1.35rem;font-weight:900;line-height:1}
    .date-title{font-weight:850;margin:10px 0 4px;line-height:1.2}
    .date-dist{font-size:.82rem;color:var(--accent);font-weight:850}
    .date-summary{font-size:.78rem;color:var(--muted);margin-top:7px;line-height:1.35}
    .click-hint{font-size:.7rem;color:var(--muted);margin-top:9px;font-weight:750}
    .modal-backdrop{
      position:fixed;inset:0;z-index:100;background:rgba(2,8,14,.78);backdrop-filter:blur(8px);
      display:grid;place-items:center;padding:18px;
    }
    .modal-card{
      width:min(760px,100%);max-height:90vh;overflow:auto;border:1px solid #365572;border-radius:24px;
      background:linear-gradient(160deg,var(--modal1),var(--modal2));box-shadow:0 30px 90px rgba(0,0,0,.5);padding:24px;
    }
    .modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
    .modal-title{font-size:1.7rem;font-weight:900;letter-spacing:-.03em;line-height:1.08}
    .modal-date{color:var(--accent);font-size:.86rem;font-weight:850;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
    .close-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:1.3rem}
    .workout-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 18px}
    .workout-kpi{border:1px solid var(--line);border-radius:13px;padding:12px;background:rgba(255,255,255,.025)}
    .workout-kpi span{display:block;color:var(--muted);font-size:.71rem;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
    .workout-kpi strong{display:block;margin-top:4px;font-size:.96rem}
    .step-list{display:grid;gap:10px}
    .step{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--soft)}
    .step strong{display:block;color:var(--text);margin-bottom:4px}
    .step p{font-size:.88rem;margin:0}
    .track-chip{display:inline-block;border-radius:999px;padding:4px 8px;margin:4px 4px 0 0;font-size:.72rem;font-weight:850;
      background:rgba(130,184,255,.1);color:#d4e6ff;border:1px solid rgba(130,184,255,.18)}
    @media (max-width:980px){.calendar-days{grid-template-columns:repeat(4,1fr)}}
    @media (max-width:640px){
      .calendar-days{grid-template-columns:1fr 1fr}
      .workout-kpis{grid-template-columns:1fr}
      .modal-card{padding:18px}.modal-title{font-size:1.4rem}
    }


    .theme-control{
      display:flex;align-items:center;gap:5px;padding:5px;border:1px solid var(--line);
      border-radius:12px;background:var(--panel);margin-left:auto;
    }
    .theme-control button{
      border:0;background:transparent;color:var(--muted);padding:7px 10px;border-radius:8px;
      cursor:pointer;font-weight:800;font-size:.8rem;
    }
    .theme-control button.active{background:var(--panel2);color:var(--text)}


    .log-status{
      display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;
      font-size:.69rem;font-weight:900;margin-top:8px;border:1px solid var(--line)
    }
    .log-status.done{background:rgba(114,225,184,.13);color:var(--accent);border-color:rgba(114,225,184,.32)}
    .log-status.modified{background:rgba(255,212,121,.12);color:var(--warn);border-color:rgba(255,212,121,.30)}
    .log-status.skipped{background:rgba(255,155,155,.10);color:var(--danger);border-color:rgba(255,155,155,.28)}
    .log-status.planned{background:var(--soft);color:var(--muted)}
    .date-card.logged{box-shadow:inset 0 0 0 1px rgba(114,225,184,.18)}
    .log-section{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
    .log-section h3{font-size:1.2rem;margin-bottom:4px}
    .log-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:13px}
    .field{display:grid;gap:6px}
    .field.full{grid-column:1/-1}
    .field label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:850}
    .field input,.field select,.field textarea{
      width:100%;border:1px solid var(--line);border-radius:11px;background:var(--panel);
      color:var(--text);padding:10px 11px;font:inherit;outline:none
    }
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2)}
    .field textarea{min-height:82px;resize:vertical}
    .log-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
    .compare-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}
    .compare-card{border:1px solid var(--line);border-radius:13px;padding:12px;background:var(--soft)}
    .compare-card .cap{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:850}
    .compare-card .big{font-size:1.1rem;font-weight:900;margin-top:4px}
    .compare-card .sub{font-size:.8rem;color:var(--muted);margin-top:3px}
    .week-progress{font-size:.76rem;color:var(--muted);margin-top:4px}
    .week-progress strong{color:var(--text)}
    .progress-bar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin-top:6px}
    .progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .2s ease}
    .summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .log-table td,.log-table th{white-space:nowrap}
    .log-table .notes-cell{white-space:normal;min-width:220px}
    .empty-state{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
    .backup-actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}
    .hidden-input{display:none}
    @media (max-width:720px){
      .log-grid,.compare-grid{grid-template-columns:1fr}
      .summary-grid{grid-template-columns:1fr 1fr}
    }

    .footer{margin-top:34px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.86rem}
    .small{font-size:.86rem}
    ul{margin:8px 0 0 20px;padding:0;color:var(--text)}
    li{margin:5px 0}
    .race-row{display:grid;grid-template-columns:120px 170px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
    .race-row:last-child{border-bottom:0}
    .race-row strong{color:var(--text)}
    @media (max-width:980px){
      .grid.cols-4{grid-template-columns:repeat(2,1fr)}
      .grid.cols-3{grid-template-columns:1fr 1fr}
      .days{grid-template-columns:1fr 1fr}
    }
    @media (max-width:640px){
      .app{padding:14px 12px 50px}.hero{padding:24px 18px}
      .grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
      .week-head{grid-template-columns:58px 1fr auto}.chev{display:none}.days{grid-template-columns:1fr}
      .race-row{grid-template-columns:1fr;gap:2px}.nav{top:6px}
    }
    @media print{
      :root{--bg:#fff;--panel:#fff;--panel2:#f4f7fa;--text:#101820;--muted:#52606d;--line:#d8dee6;--accent:#147d64}
      body{background:#fff;color:#111}.app{max-width:none;padding:0}.hero,.card,.week{box-shadow:none}
      .nav,.top-actions,.week-toolbar{display:none!important}.section{break-inside:avoid}
      .week-body{display:block!important}.days{grid-template-columns:repeat(5,1fr)}
      p,td,li,.lead,.day .details{color:#263542}.badge{color:#263542}
    }
  </style>
</head>

function Metric({item}) {
  return e("div",{className:"card metric"},
    e("div",{className:"value"},item[1]),
    e("div",{className:"label"},item[0]),
    e("div",{className:"note"},item[2])
  );
}

function MileageChart(){
  const vals=weeks.map(w=>parseFloat(w.mi));
  const W=920,H=220,pad=36,max=42;
  const pts=vals.map((v,i)=>{
    const x=pad+i*((W-pad*2)/(vals.length-1));
    const y=H-pad-(v/max)*(H-pad*2);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return e("div",{className:"card"},
    e("h2",null,"Weekly mileage progression"),
    e("p",{className:"small muted"},"Starts with a conservative 24.9-mile absorption week because Garmin currently flags running impact above tolerance, then builds with regular cutbacks and peaks just under 40 miles."),
    e("svg",{viewBox:`0 0 ${W} ${H}`,className:"chart",role:"img","aria-label":"Weekly mileage chart"},
      [20,30,40].map(v=>{
        const y=H-pad-(v/max)*(H-pad*2);
        return e(React.Fragment,{key:v},
          e("line",{x1:pad,y1:y,x2:W-pad,y2:y,stroke:"rgba(158,178,201,.18)","stroke-width":"1"}),
          e("text",{x:2,y:y+4,fill:"#9eb2c9","font-size":"12"},v+" mi")
        )
      }),
      e("path",{d:path,fill:"none",stroke:"#72e1b8","stroke-width":"4","stroke-linecap":"round","stroke-linejoin":"round"}),
      pts.map((p,i)=>e("circle",{key:i,cx:p[0],cy:p[1],r:4.5,fill:"#07111f",stroke:"#72e1b8","stroke-width":"3"})),
      [0,3,7,11,15,18].map(i=>e("text",{key:i,x:pts[i][0]-8,y:H-7,fill:"#9eb2c9","font-size":"12"},"W"+(i+1)))
    ),
    e("div",{className:"legend"},
      e("span",null,"Peak: 40.7 mi"),
      e("span",null,"Longest run: 20.0 mi · Key MP run: 18.6 mi"),
      e("span",null,"Race: 26.2 mi")
    )
  );
}


const dayOrder = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const dayOffset = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
const startDate = new Date(2026,6,27,12,0,0);

function dateFor(weekNum,dow){
  const d = new Date(startDate);
  d.setDate(d.getDate() + (weekNum-1)*7 + dayOffset[dow]);
  return d;
}
function niceDate(d){
  return d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
}
function shortDate(d){
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function weekEntry(week,dow){ return week.days.find(d=>d[0]===dow); }

function prescribeDay(week,dow){
  const date = dateFor(week.w,dow);
  const iso = date.toISOString().slice(0,10);
  if(dow==="Mon"){
    return {date,iso,dow,week:week.w,title:"Rest + strength",type:"Rest",distance:"No run",
      pace:"—",hr:"—",
      structure:"No running. Do 25–35 minutes of strength: split squats/lunges, Romanian deadlifts, straight-knee calf raises, bent-knee soleus raises, hamstring work, and core stability. Keep 2–3 reps in reserve.",
      note:"If your legs are unusually sore from Saturday, reduce the load rather than forcing strength."};
  }
  if(dow==="Fri"){
    return {date,iso,dow,week:week.w,title:"Rest day",type:"Rest",distance:"No run",
      pace:"—",hr:"—",
      structure:"Rest from running. Normal walking/mobility is fine. Prioritize hydration, sleep, and getting ready for Saturday's long run.",
      note:"Do not add a make-up workout here unless the plan has been deliberately rearranged."};
  }
  if(dow==="Tue"){
    const t=trackWorkouts[week.w-1];
    return {date,iso,dow,week:week.w,title:t.title,type:"Track / Quality",distance:t.total,
      pace:"Easy running 10:45–11:45/mi; interval targets listed below",hr:t.hr,
      structure:t.main,note:t.splits,track:t};

      note:"Target halfway around 1:57:30–1:58:00. A 3:55 goal gives you useful margin for sub-4, but do not bank time early on CIM's downhill course."};
  }

const LOG_KEY = "utkarsh-cim-2026-training-log-v1";

function loadTrainingLog(){
  try { return JSON.parse(localStorage.getItem(LOG_KEY) || "{}"); }
  catch(e) { return {}; }
}
function saveTrainingLog(log){
  try { localStorage.setItem(LOG_KEY,JSON.stringify(log)); } catch(e) {}
}
function plannedMiles(distance){
  if(!distance || distance==="No run" || distance==="—") return 0;
  const m=String(distance).match(/(\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : 0;
}
function parseDurationToSeconds(v){
  if(!v) return null;
  const parts=String(v).trim().split(":").map(Number);
  if(parts.some(x=>Number.isNaN(x))) return null;
  if(parts.length===2) return parts[0]*60+parts[1];
  if(parts.length===3) return parts[0]*3600+parts[1]*60+parts[2];
  return null;
}
function secondsToPace(sec){
  if(sec==null || !Number.isFinite(sec) || sec<=0) return "";
  const min=Math.floor(sec/60);
  const s=Math.round(sec-min*60);
  return `${min}:${String(s===60?0:s).padStart(2,"0")}${s===60?" (≈"+(min+1)+":00)":""}/mi`;
}
function derivedPace(distance,duration){
  const d=parseFloat(distance);
  const sec=parseDurationToSeconds(duration);
  if(!Number.isFinite(d) || d<=0 || !sec) return "";
  const pace=sec/d;
  const min=Math.floor(pace/60);
  const s=Math.round(pace-min*60);
  if(s===60) return `${min+1}:00/mi`;
  return `${min}:${String(s).padStart(2,"0")}/mi`;
}
function statusLabel(status){
  return status==="done"?"Done":status==="modified"?"Modified":status==="skipped"?"Skipped":"Planned";
}
function downloadText(filename,text,type){
  const blob=new Blob([text],{type:type||"text/plain"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
}
function allPrescribedDays(){
  const arr=[];
  weeks.forEach(w=>dayOrder.forEach(d=>arr.push(prescribeDay(w,d))));
  return arr;
}
function logToCSV(log){
  const days=allPrescribedDays();
  const headers=["date","week","day","planned_workout","planned_distance","planned_pace","status","actual_distance_mi","duration","actual_pace","avg_hr","rpe","actual_workout","notes"];
  const quote=v=>`"${String(v??"").replaceAll('"','""')}"`;
  const rows=days.filter(d=>log[d.iso]).map(d=>{
    const x=log[d.iso]||{};
    const pace=x.actualPace||derivedPace(x.actualDistance,x.duration);
    return [d.iso,d.week,d.dow,d.title,d.distance,d.pace,x.status||"planned",x.actualDistance||"",x.duration||"",pace,x.avgHr||"",x.rpe||"",x.actualWorkout||"",x.notes||""].map(quote).join(",");
  });
  return [headers.join(","),...rows].join("\n");
}

function ProgressSection({log,onImport}){
  const days=allPrescribedDays();
  const runDays=days.filter(d=>plannedMiles(d.distance)>0);
  const logged=runDays.filter(d=>log[d.iso] && ["done","modified","skipped"].includes(log[d.iso].status));
  const completed=runDays.filter(d=>log[d.iso] && ["done","modified"].includes(log[d.iso].status));
  const actualMiles=runDays.reduce((sum,d)=>{
    const x=log[d.iso]; const n=x?parseFloat(x.actualDistance):NaN;
    return sum+(Number.isFinite(n)?n:0);
  },0);
  const plannedLoggedMiles=runDays.reduce((sum,d)=>{
    const x=log[d.iso];
    return sum+(x && ["done","modified","skipped"].includes(x.status)?plannedMiles(d.distance):0);
  },0);
  const adherence=logged.length?Math.round(completed.length/logged.length*100):0;
  const loggedRows=days.filter(d=>log[d.iso] && log[d.iso].status!=="planned");

  const importRef=React.useRef(null);
  const handleImport=ev=>{
    const file=ev.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if(parsed && typeof parsed==="object") onImport(parsed);
        else alert("That file does not contain a valid training log.");
      }catch(err){ alert("Could not read that JSON backup."); }
      ev.target.value="";
    };
    reader.readAsText(file);
  };

  return e("section",{id:"progress",className:"section"},
    e("h2",null,"Planned vs actual"),
    e("p",{className:"muted"},"Your daily entries from the clickable calendar roll up here automatically."),
    e("div",{className:"summary-grid"},
      e(Metric,{item:["Logged run days",String(logged.length),`${completed.length} completed/modified`]}),
      e(Metric,{item:["Completion",adherence+"%","Completed or modified ÷ all resolved run days"]}),
      e(Metric,{item:["Actual mileage",actualMiles.toFixed(1)+" mi","Across logged activities"]}),
      e(Metric,{item:["Plan mileage resolved",plannedLoggedMiles.toFixed(1)+" mi","Planned mileage for days you've marked done/modified/skipped"]})
    ),
    e("div",{className:"backup-actions"},
      e("button",{className:"btn",onClick:()=>downloadText("utkarsh-cim-training-log.csv",logToCSV(log),"text/csv")},"Export CSV"),
      e("button",{className:"btn",onClick:()=>downloadText("utkarsh-cim-training-log-backup.json",JSON.stringify(log,null,2),"application/json")},"Backup JSON"),
      e("button",{className:"btn",onClick:()=>importRef.current?.click()},"Restore JSON"),
      e("input",{ref:importRef,className:"hidden-input",type:"file",accept:".json,application/json",onChange:handleImport})
    ),
    loggedRows.length===0
      ? e("div",{className:"empty-state"},"No completed workouts logged yet. Click a calendar date, enter what you did, and save it.")
      : e("div",{className:"table-wrap"},
          e("table",{className:"log-table"},
            e("thead",null,e("tr",null,["Date","Plan","Actual","Status","Pace","Avg HR","RPE","Notes"].map(x=>e("th",{key:x},x)))),
            e("tbody",null,loggedRows.map(d=>{
              const x=log[d.iso];
              const pace=x.actualPace||derivedPace(x.actualDistance,x.duration)||"—";
              return e("tr",{key:d.iso},
                e("td",null,shortDate(d.date)),

                e("td",null,x.actualDistance?x.actualDistance+" mi":"—"),

              )
            }))
          )
        )
  );
}

    )
  );
